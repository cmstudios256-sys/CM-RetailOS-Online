    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CM RetailOS" />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('cm_retailos_online_settings_prefs_v1');
          var theme = 'dark';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.applicationSettings && parsed.applicationSettings.themeMode) {
              theme = parsed.applicationSettings.themeMode;
            }
          }
          var isLight = theme === 'light' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (isLight) {
            document.documentElement.setAttribute('data-theme', 'light');
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', '#f1f5f9');
            var sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
            if (sb) sb.setAttribute('content', 'default');
          }
        } catch (e) {}
      })();
    </script>
