services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: retailos
      POSTGRES_USER: retailos
      POSTGRES_PASSWORD: retailos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailos -d retailos"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://retailos:retailos@postgres:5432/retailos?sslmode=disable
      JWT_SECRET: local-docker-jwt-secret-at-least-32-characters
      HTTP_ADDR: :8080
      COOKIE_SECURE: "false"
      FRONTEND_DIR: /app/web/dist

volumes:
  postgres_data:
